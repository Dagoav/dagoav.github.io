<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><style>body,html{margin:0;padding:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;background:0 0;font-family:monospace}.fiber-container{position:relative;width:300px;height:150px;background:#0d0f14;border:2px solid #1e293b;border-radius:8px;padding:20px;box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 10px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;justify-content:space-between}.port-row{display:flex;justify-content:space-between;width:100%;z-index:2}.port{width:16px;height:16px;background:#1a1d24;border:1px solid #334155;border-radius:2px;position:relative}.port::after{content:'';position:absolute;top:3px;left:3px;width:8px;height:8px;background:#000;border-radius:1px}svg{position:absolute;top:20px;left:20px;width:calc(100% - 40px);height:calc(100% - 40px);z-index:1;pointer-events:none}.cable{fill:none;stroke:#1d4ed8;stroke-width:3;stroke-linecap:round}.light-pulse{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:20,100;filter:drop-shadow(0 0 6px #60a5fa) drop-shadow(0 0 12px #3b82f6)}.p1{animation:flow 1.5s linear infinite}.p2{animation:flow 2s linear infinite .5s}.p3{animation:flow 1s linear infinite .2s;stroke:#34d399;filter:drop-shadow(0 0 6px #34d399)}.p4{animation:flow 2.5s linear infinite 1s}.p5{animation:flow 1.2s linear infinite .8s;stroke:#a855f7;filter:drop-shadow(0 0 6px #a855f7)}@keyframes flow{0%{stroke-dashoffset:120}100%{stroke-dashoffset:-40}}.fiber-container::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:20px 20px;pointer-events:none;z-index:0}</style></head><body><div class="fiber-container"><div class="port-row"><div class="port" id="t1"></div><div class="port" id="t2"></div><div class="port" id="t3"></div><div class="port" id="t4"></div><div class="port" id="t5"></div><div class="port" id="t6"></div><div class="port" id="t7"></div><div class="port" id="t8"></div></div><svg viewBox="0 0 260 110"><path class="cable" d="M 8 0 C 8 40, 50 70, 50 110"/><path class="cable" d="M 44 0 C 44 60, 150 50, 150 110"/><path class="cable" d="M 116 0 C 116 30, 15 80, 15 110"/><path class="cable" d="M 188 0 C 188 60, 222 50, 222 110"/><path class="cable" d="M 260 0 C 260 40, 188 80, 188 110"/><path class="light-pulse p1" pathLength="100" d="M 8 0 C 8 40, 50 70, 50 110"/><path class="light-pulse p2" pathLength="100" d="M 44 0 C 44 60, 150 50, 150 110"/><path class="light-pulse p3" pathLength="100" d="M 116 0 C 116 30, 15 80, 15 110"/><path class="light-pulse p4" pathLength="100" d="M 188 0 C 188 60, 222 50, 222 110"/><path class="light-pulse p5" pathLength="100" d="M 260 0 C 260 40, 188 80, 188 110"/></svg><div class="port-row"><div class="port"></div><div class="port" id="b2"></div><div class="port" id="b3"></div><div class="port" id="b4"></div><div class="port" id="b5"></div><div class="port" id="b6"></div><div class="port" id="b7"></div><div class="port"></div></div></div></body></html>
