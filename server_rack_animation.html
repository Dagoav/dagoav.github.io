<style>
  body {
    margin: 0;
    overflow: hidden;
    height: 100%;
    /* height: 74vh; */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .rack-wrap {
    position: relative;
    padding: 2rem 1rem;
    border-radius: 12px;
    user-select: none;
    transform: scale(1.6);
  }

  .rack {
    width: 160px;
    height: auto;
    background: #1a1d24;
    border: 2px solid #2a2d36;
    border-radius: 6px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .rack-label {
    text-align: center;
    font-family: monospace;
    font-size: 11px;
    color: #ffffff;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .unit {
    background: #0d0f14;
    border: 1px solid #1e2130;
    border-radius: 4px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .unit-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
  }

  .unit-name {
    font-family: monospace;
    font-size: 10px;
    color: #ffffff;
    flex: 1;
  }

  .unit-lights {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .led-green {
    background: #22c55e;
  }

  .led-amber {
    background: #f59e0b;
  }

  .led-red {
    background: #ef4444;
  }

  .led-blue {
    background: #3b82f6;
  }

  .led-off {
    background: #1e2130;
  }

  .fan-wrap {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: 4px;
  }

  .fan {
    width: 14px;
    height: 14px;
    position: relative;
  }

  .fan svg {
    width: 14px;
    height: 14px;
  }

  .activity-bar {
    flex: 1;
    height: 4px;
    background: #1e2130;
    border-radius: 2px;
    overflow: hidden;
  }

  .activity-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .cables {
    display: flex;
    gap: 3px;
    margin-top: 4px;
    justify-content: center;
  }

  .cable {
    width: 4px;
    height: 20px;
    border-radius: 0 0 2px 2px;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #1e2130;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-text {
    font-family: monospace;
    font-size: 9px;
    color: #ffffff;
  }

  .temp-badge {
    font-family: monospace;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: #1a1d24;
    color: #555;
    border: 1px solid #1e2130;
  }

  @keyframes blink {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: 0.2
    }
  }

  @keyframes blink-slow {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: 0.4
    }
  }

  @keyframes spin {
    from {
      transform: rotate(0deg)
    }

    to {
      transform: rotate(360deg)
    }
  }

  @keyframes spin-rev {
    from {
      transform: rotate(0deg)
    }

    to {
      transform: rotate(-360deg)
    }
  }

  @keyframes pulse-bar {

    0%,
    100% {
      opacity: 0.6
    }

    50% {
      opacity: 1
    }
  }
</style>

<script>
  const temps = [40, 41, 42, 43, 42, 41, 43, 44, 42, 41];
  let ti = 0;
  setInterval(() => {
    document.getElementById('temp').textContent = temps[ti % temps.length] + '°C';
    ti++;
  }, 2000);

  function randBar(el, min, max, color) {
    const v = Math.round(min + Math.random() * (max - min));
    el.style.width = v + '%';
  }
  setInterval(() => {
    randBar(document.getElementById('cpu1'), 55, 85, '#3b82f6');
    randBar(document.getElementById('cpu2'), 25, 55, '#3b82f6');
    randBar(document.getElementById('cpu3'), 10, 35, '#a855f7');
    randBar(document.getElementById('mem1'), 45, 70, '#6366f1');
    randBar(document.getElementById('disk3'), 55, 70, '#ec4899');
  }, 1800);
</script>
